box-sizing:border-box;

}

body{
background:linear-gradient(135deg,#111827,#1f2937);
padding:20px;

}

.container{

.card{

.rental-box{

font-weight:700;

.whatsapp-btn{

align-items:center;
justify-content:center;
gap:12px;
background:#25D366;
color:white;
text-decoration:none;
padding:18px;
border-radius:60px;
font-size:22px;
font-weight:700;
max-width:420px;
margin:0 auto 25px auto;
box-shadow:0 0 30px rgba(37,211,102,.5);
transition:0.3s;
}

.whatsapp-btn:hover{
transform:scale(1.03);
}

.whatsapp-btn img{
width:35px;

.level-box{

padding:20px;

font-size:30px;
font-weight:800;

.roles{

.role{
background:#0d0d0d;
border:1px solid #333;
border-radius:18px;
padding:25px 10px;
color:white;
font-size:22px;
font-weight:600;
}

.book-box{
background:#0033aa;
padding:22px;
border-radius:18px;
font-size:32px;
font-weight:800;
color:white;
margin-bottom:25px;
}

.book-box span{
color:#f5c542;
}

.tagline{
color:white;
font-size:20px;
font-weight:600;
margin-bottom:25px;
}

.bottom-box{
background:#0033aa;
padding:18px;
border-radius:18px;
color:white;
font-size:20px;
font-weight:600;
}

.footer{
text-align:center;
margin-top:25px;
color:#cfcfcf;
font-size:15px;
}

@media(max-width:768px){

.main-title{
font-size:50px;
}

.level-box{
font-size:22px;
}

.book-box{
font-size:24px;
